{% extends "base.html" %}

{% block title %}Create Exam — Luminead{% endblock %}
{% block page_title %}Create Exam{% endblock %}

{% block content %}
<div class="max-w-xl">
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
            <h3 class="text-base font-bold text-gray-900">Schedule New Exam</h3>
        </div>
        <form method="post" class="p-6 space-y-5">
            {% csrf_token %}
            <div>
                <label for="id_section" class="block text-sm font-semibold text-gray-700 mb-1.5">Section *</label>
                {{ form.section }}
            </div>
            <div>
                <label for="id_name" class="block text-sm font-semibold text-gray-700 mb-1.5">Exam Name *</label>
                {{ form.name }}
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="id_date" class="block text-sm font-semibold text-gray-700 mb-1.5">Date *</label>
                    {{ form.date }}
                </div>
                <div>
                    <label for="id_max_marks" class="block text-sm font-semibold text-gray-700 mb-1.5">Max Marks *</label>
                    {{ form.max_marks }}
                </div>
            </div>
            <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
                <button type="submit" class="px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm rounded-xl transition-colors">
                    Create Exam
                </button>
                <a href="{% url 'core:exam_list' %}" class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 font-semibold text-sm rounded-xl">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
