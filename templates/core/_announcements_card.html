<!-- Latest Announcements Dashboard Card -->
<div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 p-6">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-gray-900 dark:text-white inline-flex items-center gap-2">
            <i data-lucide="megaphone" class="w-4 h-4 text-primary-500"></i>
            Latest Announcements
        </h3>
        <a href="{% url 'core:announcement_list' %}" class="text-xs font-semibold text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 inline-flex items-center gap-1">
            View all <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        </a>
    </div>
    {% if recent_announcements %}
    <div class="space-y-3">
        {% for ann in recent_announcements %}
        <a href="{% url 'core:announcement_detail' pk=ann.pk %}" class="flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors group">
            <div class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center
                {% if ann.priority == 'urgent' %}bg-red-50 dark:bg-red-950/40
                {% elif ann.priority == 'important' %}bg-amber-50 dark:bg-amber-950/40
                {% else %}bg-primary-50 dark:bg-primary-950/40{% endif %}">
                <i data-lucide="{% if ann.priority == 'urgent' %}alert-triangle{% elif ann.priority == 'important' %}alert-circle{% else %}megaphone{% endif %}"
                   class="w-4 h-4 {% if ann.priority == 'urgent' %}text-red-600 dark:text-red-400{% elif ann.priority == 'important' %}text-amber-600 dark:text-amber-400{% else %}text-primary-600 dark:text-primary-400{% endif %}"></i>
            </div>
            <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-gray-800 dark:text-slate-200 group-hover:text-primary-600 dark:group-hover:text-primary-400 truncate">{{ ann.title }}</p>
                <p class="text-[11px] text-gray-400 dark:text-slate-500 mt-0.5">{{ ann.created_at|timesince }} ago · {{ ann.get_audience_display }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-sm text-gray-400 dark:text-slate-500 text-center py-4">No announcements yet.</p>
    {% endif %}
</div>
